- name: Setup Theos
  run: |
    set -e

    if [ ! -d "$GITHUB_WORKSPACE/theos" ]; then
      git clone --recursive \
        https://github.com/theos/theos.git \
        "$GITHUB_WORKSPACE/theos"
    fi

    echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

- name: Create missing project files
  run: |
    set -e

    find . -maxdepth 1 -type f -name 'Eri.plist*' -delete

    cat > Eri.plist <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
 "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>Filter</key>
    <dict>
        <key>Bundles</key>
        <array>
            <string>com.garena.game.menu</string>
        </array>
    </dict>
</dict>
</plist>
EOF

    if [ ! -f control ]; then
      cat > control <<'EOF'
Package: com.eri.eri
Name: Eri
Depends: mobilesubstrate
Version: 1.0.0
Architecture: iphoneos-arm
Description: Eri iOS tweak
Maintainer: eri
Author: eri
Section: Tweaks
EOF
    fi

    test -f Makefile
    test -f menu.mm
    test -f Eri.plist

    plutil -lint Eri.plist

- name: Install ldid
  run: |
    set -e

    brew install ldid || true
    echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

    echo "ldid:"
    which ldid
    ldid -h 2>&1 | head -20

- name: Build package
  run: |
    set -e

    export THEOS="$GITHUB_WORKSPACE/theos"

    echo "THEOS=$THEOS"
    echo "ldid=$(which ldid)"

    make clean
    make package FINALPACKAGE=1

- name: Find package
  run: |
    find . -type f -name "*.deb" -print

- name: Upload package
  uses: actions/upload-artifact@v4
  with:
    name: Eri-package
    path: packages/*.deb
    if-no-files-found: error
