name: Build Eri

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e

          if [ ! -d "$GITHUB_WORKSPACE/theos" ]; then
            git clone --recursive \
              https://github.com/theos/theos.git \
              "$GITHUB_WORKSPACE/theos"
          fi

          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Create missing project files
        run: |
          set -e

          echo "Working directory:"
          pwd

          echo "Existing files:"
          find . -maxdepth 1 -type f -print

          # Xóa mọi tên Eri.plist có ký tự thừa ở cuối
          find . -maxdepth 1 -type f -name 'Eri.plist*' -delete

          # Tạo Eri.plist chính xác
          cat > ./Eri.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
           "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <key>Bundles</key>
                  <array>
                      <string>com.garena.game.menu</string>
                  </array>
              </dict>
          </dict>
          </plist>
          EOF

          # Tạo control nếu thiếu
          if [ ! -f "./control" ]; then
            cat > ./control <<'EOF'
          Package: com.eri.eri
          Name: Eri
          Depends: mobilesubstrate
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: Eri iOS tweak
          Maintainer: eri
          Author: eri
          Section: Tweaks
          EOF
          fi

          # Makefile phải tồn tại
          if [ ! -f "./Makefile" ]; then
            echo "ERROR: Makefile is missing"
            exit 1
          fi

          # menu.mm phải tồn tại
          if [ ! -f "./menu.mm" ]; then
            echo "ERROR: menu.mm is missing"
            exit 1
          fi

          echo "===== CREATED FILES ====="
          ls -lab ./Eri.plist ./control ./Makefile ./menu.mm

          echo "===== PLIST CHECK ====="
          plutil -lint ./Eri.plist

          echo "===== PLIST CONTENT ====="
          cat ./Eri.plist

      - name: Build package
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"

          echo "THEOS=$THEOS"
          echo "PWD=$(pwd)"

          make clean
          make package FINALPACKAGE=1

      - name: Find package
        run: |
          echo "===== PACKAGES ====="
          find . -type f -name "*.deb" -print

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Eri-package
          path: packages/*.deb
          if-no-files-found: error
