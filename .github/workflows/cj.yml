name: cj

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Theos
      uses: Randomblock1/theos-action@v1

    - name: Build Tweak
      run: make package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Eri-Package
        path: |
          .theos/obj/*.dylib
          .theos/obj/debug/*.dylib
          packages/*.deb
