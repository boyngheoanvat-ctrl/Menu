name: Build Eri

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Check project
        run: |
          set -e

          echo "PWD:"
          pwd

          echo "FILES:"
          find . -maxdepth 2 -type f -print | sort

          echo "CHECK Makefile:"
          test -f ./Makefile

          echo "CHECK Eri.plist:"
          test -f ./Eri.plist

          echo "CHECK control:"
          test -f ./control

          echo "CHECK menu.mm:"
          test -f ./menu.mm

          echo "Eri.plist:"
          cat ./Eri.plist

          echo "Validate plist:"
          plutil -lint ./Eri.plist

      - name: Build package
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"

          make clean
          make package FINALPACKAGE=1

      - name: Show packages
        run: |
          find . -type f \( -name "*.deb" -o -name "*.ipa" \) -print

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Eri-package
          path: packages/*.deb
          if-no-files-found: error
